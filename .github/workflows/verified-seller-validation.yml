name: Seller profile and verification validation

on:
  push:
    branches:
      - feature/profile-and-verified-seller
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://nova:nova@localhost:5432/nova?schema=public
          DIRECT_URL: postgresql://nova:nova@localhost:5432/nova?schema=public
      - name: Run TypeScript checks
        run: npm run lint
